<head>

  <title>雷雷 AI 实验室 · 自动发布验证</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="badge">🚀 GitHub Actions 自动发布测试</div>
      <h1 class="title">雷雷 AI 实验室 · V2</h1>
      <p class="description">
        自动发布验证进行中：这次只修改网页代码，不触碰部署配置。如果你刷新线上页面后看到这段文字，就说明 GitHub Actions 已经自动完成了发布。
      </p>
      <button id="actionBtn" class="btn">验证自动发布</button>

        <p>✅ 如果你能看到这里，说明网页交互仍然正常；如果这次变化是自动出现在 GitHub Pages 上，CI/CD 链路也验证成功。</p>

    </div>
